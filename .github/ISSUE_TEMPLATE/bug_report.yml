---
name: Bug Report
description: Report a bug in otel-data-ui
title: 'bug: '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please fill out the sections below.

  - type: dropdown
    id: page
    attributes:
      label: Affected Page
      description: Which page or component is affected?
      options:
        - Dashboard
        - Locations
        - Location Detail
        - Garmin Activities
        - Garmin Detail
        - Unified Map
        - Daily Summary
        - Reference Locations
        - Spatial Tools
        - Navigation / Layout
        - Authentication
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Go to ...
        2. Click on ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened. Include error messages or console output.
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: Environment
      description: Where does this occur?
      options:
        - Production (data-ui.lab.informationcart.com)
        - Local development (localhost:5173)
        - Docker container
        - CI pipeline
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser
      description: Which browser and version?
      placeholder: 'e.g., Chrome 134, Firefox 136, Safari 18'

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots / Console Errors
      description: Add screenshots or browser console output if applicable.

  - type: checkboxes
    id: checklist
    attributes:
      label: Pre-submission Checklist
      options:
        - label: I have checked the existing issues for duplicates
          required: true
        - label: I have tested with the latest version on master
