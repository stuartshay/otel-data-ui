name: Lint, Validate and Test

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

concurrency:
  group: lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  COVERAGE_MINIMUM: '80'
  NODE_VERSION: '24'

jobs:
  lint:
    name: ESLint and TypeScript Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --fund=false

      - name: Run ESLint
        run: npm run lint

      - name: TypeScript Check
        run: npm run type-check

      - name: Markdown Lint
        run: npm run lint:md

      - name: Spell Check
        run: npm run lint:spell

      - name: Format Check
        run: npm run format:check

      - name: Summary
        if: always()
        run: |
          {
            echo "## Lint Summary"
            echo ""
            echo "✅ All linting checks completed"
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --fund=false

      - name: Build
        run: npm run build

  docker-lint:
    name: Dockerfile Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run Hadolint
        uses: hadolint/hadolint-action@v3.3.0
        with:
          dockerfile: Dockerfile

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --fund=false

      - name: Run npm audit
        run: npm audit --audit-level=moderate || true

  test:
    name: Tests and Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --fund=false

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Enforce total coverage
        run: |
          if [ ! -f coverage/coverage-summary.json ]; then
            echo "ERROR: coverage/coverage-summary.json was not generated"
            exit 1
          fi

          minimum="${COVERAGE_MINIMUM}"
          failed=0

          read_coverage_pct() {
            key="$1"
            pct=$(jq -er ".total.${key}.pct | numbers" coverage/coverage-summary.json) || {
              echo "ERROR: total ${key} coverage percentage is missing or invalid" >&2
              return 1
            }
            printf '%s\n' "${pct}"
          }

          for key in statements functions lines; do
            pct=$(read_coverage_pct "${key}") || {
              failed=1
              continue
            }
            awk -v key="${key}" -v pct="${pct}" -v min="${minimum}" '
              BEGIN {
                if (pct + 0 < min + 0) {
                  printf("ERROR: total %s coverage %.2f%% is below required %.2f%%\n", key, pct, min)
                  exit 1
                }
                printf("OK: total %s coverage %.2f%% meets required %.2f%%\n", key, pct, min)
              }
            ' || failed=1
          done

          branch_pct=$(read_coverage_pct branches) || failed=1
          echo "INFO: total branch coverage is ${branch_pct}% (Vitest threshold enforced separately)"

          exit "${failed}"

      - name: Upload coverage summary
        if: always() && hashFiles('coverage/coverage-summary.json') != ''
        uses: actions/upload-artifact@v7
        with:
          name: coverage-summary
          path: coverage/coverage-summary.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Coverage Report
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            {
              echo "## Test Coverage Report"
              echo ""
              echo "Required minimum: ${COVERAGE_MINIMUM}% for total statements, functions, and lines."
              echo ""
              echo "| Category | Covered | Total | Percentage |"
              echo "|----------|---------|-------|------------|"
              for key in lines statements functions branches; do
                covered=$(jq -r ".total.${key}.covered" coverage/coverage-summary.json)
                total=$(jq -r ".total.${key}.total" coverage/coverage-summary.json)
                pct=$(jq -r ".total.${key}.pct" coverage/coverage-summary.json)
                echo "| ${key^} | ${covered} | ${total} | ${pct}% |"
              done
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## Test Coverage Report"
              echo ""
              echo "⚠️ No coverage data generated"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  summary:
    name: Workflow Summary
    runs-on: ubuntu-latest
    needs: [lint, build, docker-lint, security, test]
    if: always()
    timeout-minutes: 5
    steps:
      - name: Download coverage summary artifact
        uses: actions/download-artifact@v8
        with:
          name: coverage-summary
          path: coverage
        continue-on-error: true

      - name: Generate workflow summary
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          DOCKER_LINT_RESULT: ${{ needs.docker-lint.result }}
          EVENT_NAME: ${{ github.event_name }}
          LINT_RESULT: ${{ needs.lint.result }}
          NODE_VERSION: ${{ env.NODE_VERSION }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REF_NAME: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          SECURITY_RESULT: ${{ needs.security.result }}
          SERVER_URL: ${{ github.server_url }}
          SHA: ${{ github.sha }}
          TEST_RESULT: ${{ needs.test.result }}
          WORKFLOW_NAME: ${{ github.workflow }}
        run: |
          status_icon() {
            case "$1" in
              success) echo "✅" ;;
              failure) echo "❌" ;;
              cancelled) echo "⚪" ;;
              skipped) echo "➖" ;;
              *) echo "❓" ;;
            esac
          }

          {
            echo "# ${WORKFLOW_NAME} Summary"
            echo ""
            echo "| Property | Value |"
            echo "|----------|-------|"
            echo "| Repository | \`${REPOSITORY}\` |"
            echo "| Event | \`${EVENT_NAME}\` |"
            echo "| Ref | \`${REF_NAME}\` |"
            echo "| Commit | \`${SHA}\` |"
            echo "| Run | [#${RUN_NUMBER}](${SERVER_URL}/${REPOSITORY}/actions/runs/${RUN_ID}) |"
            if [ -n "${PR_NUMBER}" ]; then
              echo "| Pull Request | #${PR_NUMBER} |"
            fi
            echo "| Node.js | \`${NODE_VERSION}\` |"
            echo ""
            echo "## Job Results"
            echo ""
            echo "| Job | Result |"
            echo "|-----|--------|"
            echo "| ESLint and TypeScript Check | $(status_icon "${LINT_RESULT}") \`${LINT_RESULT}\` |"
            echo "| Build Check | $(status_icon "${BUILD_RESULT}") \`${BUILD_RESULT}\` |"
            echo "| Dockerfile Lint | $(status_icon "${DOCKER_LINT_RESULT}") \`${DOCKER_LINT_RESULT}\` |"
            echo "| Security Audit | $(status_icon "${SECURITY_RESULT}") \`${SECURITY_RESULT}\` |"
            echo "| Tests and Coverage | $(status_icon "${TEST_RESULT}") \`${TEST_RESULT}\` |"
            echo ""
            echo "## Validation Scope"
            echo ""
            echo "- ESLint"
            echo "- TypeScript type-check"
            echo "- Markdown lint"
            echo "- Spell check"
            echo "- Prettier format check"
            echo "- Production build"
            echo "- Dockerfile lint"
            echo "- npm audit (informational)"
            echo "- Vitest coverage run with ${COVERAGE_MINIMUM}% minimum for total statements, functions, and lines"
            echo ""

            if [ -f coverage/coverage-summary.json ]; then
              echo "## Code Coverage"
              echo ""
              echo "Required minimum: ${COVERAGE_MINIMUM}% for total statements, functions, and lines. Branch coverage follows the Vitest threshold."
              echo ""
              echo "| Category | Covered | Total | Percentage |"
              echo "|----------|---------|-------|------------|"
              for key in lines statements functions branches; do
                covered=$(jq -r ".total.${key}.covered" coverage/coverage-summary.json)
                total=$(jq -r ".total.${key}.total" coverage/coverage-summary.json)
                pct=$(jq -r ".total.${key}.pct" coverage/coverage-summary.json)
                echo "| ${key^} | ${covered} | ${total} | ${pct}% |"
              done
            else
              echo "## Code Coverage"
              echo ""
              echo "⚠️ Coverage summary artifact was not available for this run."
            fi

            echo ""
            echo "## Notes"
            echo ""
            echo "- The security audit is non-blocking (`npm audit --audit-level=moderate || true`)."
            echo "- Build warnings, if any, remain available in the individual job logs."
          } >> "$GITHUB_STEP_SUMMARY"
